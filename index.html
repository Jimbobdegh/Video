<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>My Video Library</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10131c; color: #f5f6fa; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 50% -20%, #26314b 0, #10131c 48rem); }
    header, main, footer { width: min(100% - 2rem, 1100px); margin-inline: auto; }
    header { padding-block: clamp(3rem, 9vw, 6rem) 2rem; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4.5rem); letter-spacing: -.05em; }
    header p, footer { color: #b7bdcd; }
    main { padding-block: 1rem 4rem; }
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1.25rem; }
    article { overflow: hidden; border: 1px solid #ffffff20; border-radius: 1rem; background: #1a1e2a; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #080a0f; }
    h2 { margin: 0; padding: 1rem 1.1rem 1.2rem; font-size: 1.1rem; }
    .empty { padding: 1.25rem; border: 1px dashed #ffffff35; border-radius: .8rem; color: #c2c7d4; }
    footer { padding-block: 1.5rem 2rem; border-top: 1px solid #ffffff18; font-size: .9rem; line-height: 1.6; }
    code { padding: .12rem .35rem; border-radius: .3rem; background: #ffffff12; color: #e4e7ff; }
  </style>
</head>
<body>
  <header>
    <h1>My Video Library</h1>
    <p>Watch your videos on desktop, tablet, or mobile.</p>
  </header>
  <main>
    <section class="videos" aria-label="Videos">
      <!-- Add one video card for each MP4 you upload. See videos/README.md for instructions. -->
      <p class="empty">Add MP4 files to the <code>videos/</code> folder, then add a video card here. Instructions are in <code>videos/README.md</code>.</p>

      <!-- Example card: remove the comment markers and change the title and filename.
      <article>
        <video controls playsinline preload="metadata">
          <source src="videos/my-video.mp4" type="video/mp4">
          Your browser does not support HTML video.
        </video>
        <h2>My Video</h2>
      </article>
      -->
    </section>
  </main>
  <footer>Videos are stored in this repository. For large collections or large files, consider dedicated video hosting.</footer>
</body>
</html>
